name: Tag Release

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  tag-release:
    name: Tag release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: "startsWith(github.event.head_commit.message, 'release: v')"

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Parse release version
        id: parse
        env:
          # Pass the commit message through the environment, NOT by
          # interpolating ${{ }} into the script body. GitHub substitutes
          # ${{ }} as raw text before the shell runs, so a release body
          # containing backticks or $(...) would be executed as shell. As an
          # env var the value is inert data the regex matches against safely.
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$MSG" =~ ^release:\ v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "tag=v${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "Detected release v${BASH_REMATCH[1]}"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "Commit message does not match the release pattern, skipping"
          fi

      - name: Verify version matches Cargo.toml
        if: steps.parse.outputs.mode != 'none'
        env:
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "ERROR: commit says v${VERSION} but Cargo.toml says ${CARGO_VERSION}"
            exit 1
          fi
          echo "Version ${VERSION} matches Cargo.toml"

      - name: Check if tag exists
        id: check_tag
        if: steps.parse.outputs.mode != 'none'
        env:
          TAG: ${{ steps.parse.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists, nothing to do"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.parse.outputs.mode != 'none' && steps.check_tag.outputs.exists == 'false'
        env:
          TAG: ${{ steps.parse.outputs.tag }}
        run: |
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Created and pushed tag $TAG"

      - name: Open next dev version PR
        if: steps.parse.outputs.mode != 'none' && steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEXT_DEV="${MAJOR}.${MINOR}.$((PATCH + 1))"
          BRANCH="chore/bump-${NEXT_DEV}"

          git checkout -b "$BRANCH"

          # Only the first `version = ` line, which is the package version.
          # Cargo.lock is gitignored in this repo, so nothing else to refresh.
          sed -i "0,/^version = \"${VERSION}\"/s//version = \"${NEXT_DEV}\"/" Cargo.toml

          git add Cargo.toml
          git commit -m "chore: bump to ${NEXT_DEV} for next development iteration"
          git push origin "$BRANCH"

          gh pr create \
            --title "chore: bump to ${NEXT_DEV} for next development iteration" \
            --body "Automated version bump after the v${VERSION} release." \
            --base main \
            --head "$BRANCH"

      - name: Summary
        if: steps.parse.outputs.mode != 'none'
        env:
          TAG: ${{ steps.parse.outputs.tag }}
          EXISTS: ${{ steps.check_tag.outputs.exists }}
        run: |
          {
            echo "## Release tagged"
            echo ""
            if [ "$EXISTS" = "true" ]; then
              echo "Tag ${TAG} already existed, skipped."
            else
              echo "- Created tag: ${TAG}"
              echo "- Opened the next dev-version PR"
              echo ""
              echo "The release workflow will now publish to crates.io."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
